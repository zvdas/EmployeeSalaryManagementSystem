<mat-card appearance="outlined" class="section-card">
  <div class="section-header">
    <h2>Departments</h2>
    <app-country-select [countries]="countries()" [allowAll]="true" [(value)]="country" />
  </div>
  @if (loading()) {
    <mat-progress-bar mode="indeterminate" aria-label="Loading department statistics" />
  }
  <div class="section-body">
    <div class="table-scroll">
      <table mat-table [dataSource]="rows()" class="data-table" aria-label="Payroll by department">
        <ng-container matColumnDef="department">
          <th mat-header-cell *matHeaderCellDef>Department</th>
          <td mat-cell *matCellDef="let r">{{ r.department }}</td>
        </ng-container>
        <ng-container matColumnDef="headcount">
          <th mat-header-cell *matHeaderCellDef class="num">Headcount</th>
          <td mat-cell *matCellDef="let r" class="num">{{ r.headcount | number }}</td>
        </ng-container>
        <ng-container matColumnDef="payrollUsd">
          <th mat-header-cell *matHeaderCellDef class="num">Payroll (USD)</th>
          <td mat-cell *matCellDef="let r" class="num">{{ r.totalPayrollUsd | money }}</td>
        </ng-container>
        <ng-container matColumnDef="avgUsd">
          <th mat-header-cell *matHeaderCellDef class="num">Average (USD)</th>
          <td mat-cell *matCellDef="let r" class="num">{{ r.avgSalaryUsd | money }}</td>
        </ng-container>
        <ng-container matColumnDef="medianUsd">
          <th mat-header-cell *matHeaderCellDef class="num">Median (USD)</th>
          <td mat-cell *matCellDef="let r" class="num">{{ r.medianSalaryUsd | money }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </div>

    <div class="chart-box">
      <canvas
        baseChart
        type="bar"
        [data]="chartData()"
        [options]="chartOptions"
        aria-label="Total payroll in USD by department"
        role="img"
      ></canvas>
    </div>
  </div>
</mat-card>
